version: '3.9'

services:
  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend
    env_file:
      - backend/core/.env
    volumes:
      - ./backend:/app  # ✅ Host code mounted to container
    ports:
      - "8000:8000"
    environment:
      - DEBUG=1  # Django debug mode (auto-reloads when files change)
      - DJANGO_SETTINGS_MODULE=core.settings
    command: python manage.py runserver 0.0.0.0:8000  # Explicit run command for auto-reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend
    restart: always
    ports:
      - 3000:3000
    volumes:
      - ./frontend:/app  # Host code mounted to container
      - /app/node_modules  # Isolate host node_modules
    environment:
      - VITE_APP_BACKEND_ADDRESS=http://backend:8000  # ✅ Use service name instead of localhost
    depends_on:
      - backend  # Ensure backend starts first

volumes:
  node_modules:  # Persist node_modules to avoid conflicts