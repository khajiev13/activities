services:
  neo4j:
    image: neo4j:2026.10.1-community-trixie
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-devpassword123}
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 384m
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  silo:
    image: pgsty/silo:RELEASE.2026-10-26T00-00-00Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env.dev}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env.dev}
      GOMEMLIMIT: 600MiB
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - silo-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  silo-init:
    image: pgsty/silo:RELEASE.2026-10-26T00-00-00Z
    depends_on:
      silo:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env.dev}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env.dev}
      APP_KEY: ${APP_KEY:?Set APP_KEY in .env.dev}
      APP_SECRET: ${APP_SECRET:?Set APP_SECRET in .env.dev}
    entrypoint:
      - /bin/sh
      - -ec
      - |
        mcli alias set local http://silo:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" >/dev/null
        mcli mb --ignore-existing local/media
        mcli anonymous set download local/media/public
        mcli admin user add local "$$APP_KEY" "$$APP_SECRET" >/dev/null
        mcli admin policy attach local readwrite --user "$$APP_KEY" >/dev/null
    restart: "no"

  api:
    build:
      context: ./api
      args:
        APP_UID: ${APP_UID:-1000}
    image: eventopia-api:dev
    environment:
      EVENTOPIA_CONFIG: config-dev.yaml
    volumes:
      - ./api:/app
      - auth-data:/data/auth
    ports:
      - "127.0.0.1:8000:8000"
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      neo4j:
        condition: service_healthy
      silo-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health/ready', timeout=4)"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s

  bot:
    image: eventopia-api:dev
    environment:
      EVENTOPIA_CONFIG: config-dev.yaml
    volumes:
      - ./api:/app
      - auth-data:/data/auth
    command: python bot_main.py
    depends_on:
      api:
        condition: service_healthy

  web:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
      - web-node-modules:/app/node_modules
    ports:
      - "127.0.0.1:5173:5173"
    environment:
      VITE_PROXY_API: http://api:8000
      VITE_PROXY_MEDIA: http://silo:9000
    command: sh -c "yarn install --frozen-lockfile && yarn dev --host"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5173/api/health/ready').then(r => { if (!r.ok) process.exit(1); }).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 60s

volumes:
  neo4j-data:
  silo-data:
  auth-data:
  web-node-modules:
