[project]
name = "eventopia-api"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi==0.162.0",
    "uvicorn==0.54.0",
    "neo4j==6.4.1",
    "sqlalchemy[asyncio]==2.1.8",
    "aiosqlite==0.22.1",
    "alembic==1.20.1",
    "pyjwt==2.15.1",
    "phonenumbers==9.0.43",
    "httpx==0.28.1",
    "boto3==1.43.126",
    "pyyaml==6.0.3",
    "python-multipart==0.0.33",
]

[dependency-groups]
dev = ["pytest==9.2.0", "pytest-asyncio==1.4.1.post1", "httpx==0.28.1", "ruff==0.17.4", "testcontainers==4.15.0"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = ["integration: requires external services"]
pythonpath = ["."]

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I"]
